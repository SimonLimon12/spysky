<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Списки</title>
</head>
<body>

    <h1>Мої списки</h1>

    <h2>Невпорядкований список (ul)</h2>
    <ul>
        <li>Перший пункт</li>
        <li>Другий пункт</li>
        <li>Третій пункт</li>
    </ul>

    <h2>Впорядкований список (ol)</h2>
    <ol>
        <li>Крок один</li>
        <li>Крок два</li>
        <li>Крок три</li>
    </ol>

</body>
</html>
